name: Solid APK Releases

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# Preserve each run, and serialize publishing so older builds cannot replace Latest.
concurrency:
  group: solid-releases
  cancel-in-progress: false

env:
  SOLID_BUILD_NUMBER: ${{ github.run_number }}
  SOLID_BUILD_ATTEMPT: ${{ github.run_attempt }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [github, foss, izzy]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare permanent signing key
        env:
          SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
          SIGNING_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEY" || -z "$SIGNING_PROPERTIES" ]]; then
            echo "::error::Configure BASE_64_SIGNING_KEY and LOCAL_PROPERTIES with one permanent signing key. No temporary signing key will be generated."
            exit 1
          fi
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > app/release_keystore.jks
          printf '%s\n' "$SIGNING_PROPERTIES" > keystore.properties
          chmod +x gradlew
      - name: Translator credits
        continue-on-error: true
        run: python3 scripts/fetch_translators.py app/src/main/assets/translators.json
      - name: Validate and build signed APKs
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          ./gradlew "test${FLAVOR^}ReleaseUnitTest" "lint${FLAVOR^}Release" "assemble${FLAVOR^}Release" --stacktrace
      - name: Verify APK signatures and checksums
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/"$FLAVOR"/release/*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: solid-apks-${{ github.run_number }}-${{ github.run_attempt }}-${{ matrix.flavor }}
          path: app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f app/release_keystore.jks keystore.properties

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: solid-apks-${{ github.run_number }}-${{ github.run_attempt }}-*
          path: apks
          merge-multiple: true
      - name: Publish a new release and retain the history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd apks
          shopt -s nullglob
          files=(*.apk)
          if (( ${#files[@]} != 15 )); then
            echo "::error::Expected 15 APKs from this attempt. Rerun all jobs to avoid mixing versions."
            exit 1
          fi
          sha256sum *.apk > SHA256SUMS.txt
          tag="v1.9.0-solid.${SOLID_BUILD_NUMBER}.${SOLID_BUILD_ATTEMPT}"
          printf 'YTDLnis Solid\n\nPackage: com.themralex.ytdlnis.solid\nBuild: %s, attempt: %s\nCommit: %s\nBranch: %s\n\nInstall the APK matching your CPU, or universal. Future Solid versions update this app in place when signed with the same key. This is independent of the original YTDLnis.\n' "$SOLID_BUILD_NUMBER" "$SOLID_BUILD_ATTEMPT" "$COMMIT_SHA" "$BRANCH" > notes.txt
          options=(--latest=false --prerelease)
          if [[ "$BRANCH" == "main" ]]; then
            options=(--latest)
            # A rerun of an older commit remains in history without becoming Latest.
            latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
            if [[ "$latest" =~ ^v1\.9\.0-solid\.([0-9]+)\.([0-9]+)$ ]] && (( BASH_REMATCH[1] > SOLID_BUILD_NUMBER )); then
              options=(--latest=false)
            fi
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; preserving published assets."
            exit 0
          fi
          gh release create "$tag" *.apk SHA256SUMS.txt --target "$COMMIT_SHA" --title "YTDLnis Solid · build ${SOLID_BUILD_NUMBER}.${SOLID_BUILD_ATTEMPT}" --notes-file notes.txt "${options[@]}"
